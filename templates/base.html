<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Review App{% endblock %}</title>
        <!-- Halfmoon CSS -->
        <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" integrity="sha256-RjeFzczeuZHCyS+Gvz+kleETzBF/o84ZRHukze/yv6o=" crossorigin="anonymous">

        <!-- Halfmoon modern core theme -->
        <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/cores/halfmoon.modern.css" rel="stylesheet" integrity="sha256-DD6elX+jPmbFYPsGvzodUv2+9FHkxHlVtQi0/RJVULs=" crossorigin="anonymous">
        <!-- css-star-rating 1.3.1 -->
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css-star-rating/star-rating.min.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">

        <!-- font awesome  4.7.0 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg site-navbar" aria-label="Main navigation">
            <div class="container-fluid">
                <h1 class="site-brand-heading"><a class="navbar-brand" href="{{ url_for('main.index') }}">Review App</a></h1>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#main-navigation" aria-controls="main-navigation"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="main-navigation">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link{% if request.endpoint == 'main.index' %} active{% endif %}" {% if request.endpoint == 'main.index' %}aria-current="page"{% endif %} href="{{ url_for('main.index') }}">Home</a></li>
                        <li class="nav-item"><a class="nav-link{% if request.endpoint == 'main.add' %} active{% endif %}" {% if request.endpoint == 'main.add' %}aria-current="page"{% endif %} href="{{ url_for('main.add') }}">Add a review</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        {% block content %}{% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>
    </body>
</html>

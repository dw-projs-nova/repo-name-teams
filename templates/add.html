{% extends "base.html" %}

{% block title %}Add a review{% endblock %}

{% block content %}
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Add a review</h2>
                    {% if error %}
                        <p class="alert alert-danger" role="alert">{{ error }}</p>
                    {% endif %}
                    <form method="post">
                        <div class="input-group mb-3">
                            <span class="input-group-text" aria-hidden="true"><i class="fa fa-user"></i></span>
                            <div class="form-floating">
                                <input class="form-control" id="reviewer_name" name="reviewer_name" type="text" maxlength="120" placeholder="Your name" required>
                                <label for="reviewer_name">Your name</label>
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input class="form-control" id="title" name="title" type="text" maxlength="200" placeholder="Review title" required>
                            <label for="title">Review title</label>
                        </div>

                        <div class="form-floating mb-3">
                            <textarea class="form-control" id="content" name="content" placeholder="Write your review" style="height: 10rem" required maxlength="1000"></textarea>
                            <label for="content">Write your review</label>
                        </div>

                        <fieldset class="mb-4">
                            <legend class="form-label fs-6">Your rating</legend>
                            <div class="rating-options">
                                {% for value in range(5, 0, -1) %}
                                    <input class="rating-choice visually-hidden" id="rating-{{ value }}" name="rating" type="radio" value="{{ value }}" aria-label="{{ value }} out of 5 stars" required>
                                    <label class="rating-star" for="rating-{{ value }}">
                                        <span class="star icon" aria-hidden="true">
                                            <i class="star-empty"></i>
                                            <i class="star-filled"></i>
                                        </span>
                                    </label>
                                {% endfor %}
                            </div>
                        </fieldset>

                        <button class="btn btn-primary" type="submit">Save review</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}

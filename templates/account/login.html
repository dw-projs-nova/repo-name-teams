{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-3">Sign in or create an account</h2>
                    <p class="text-muted">We will email you a secure sign-in link. No password is needed.</p>
                    {% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
                    {% if message %}<p class="alert alert-success" role="status">{{ message }}</p>{% endif %}
                    <form method="post">
                        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                        <div class="form-floating mb-3">
                            <input class="form-control" id="email" name="email" type="email" maxlength="320" placeholder="you@example.com" required>
                            <label for="email">Email address</label>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Email me a sign-in link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}

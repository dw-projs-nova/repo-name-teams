{% extends "base.html" %}

{% block title %}Confirm sign in{% endblock %}

{% block content %}

        <div class="col-12 col-md-7 col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-3">Confirm sign in</h2>

                </div>

    </div>
</main>
{% endblock %}
